name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Deployment hardware is ARM (Raspberry Pi / Jetson), so the suite runs on
    # both arches. ubuntu-24.04-arm is a free hosted runner for public repos.
    # fail-fast is off so an ARM-only break still leaves x86 results readable.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages
        run: |
          # Pillow + opencv give node/jpeg.py's fallback chain a CPU encoder.
          # Both are optional deps (Pillow via [lerobot], opencv via robot
          # extras), so a bare SDK install has no encoder and the node-jpeg
          # tests — which assert a real backend resolves — see 'none' and fail.
          pip install -e ./packages/sdk Pillow opencv-python-headless pytest pytest-timeout ruff
      - name: Import smoke test
        run: |
          pytest tests/test_lazy_imports.py -v --timeout=300
      - name: Test suite (unit + e2e, no GPU, no robot)
        run: |
          # Both test roots. packages/sdk/tests/ is NOT a duplicate of tests/ —
          # it holds the loop-runner, movement/arbitration, and Nori-guard suites
          # (36 tests, including the ADR 0034 intervention coverage) and went
          # unrun for as long as this step named only tests/. A test that never
          # runs is worse than no test: it reads as coverage.
          pytest tests/ packages/sdk/tests/ -v --timeout=120
      - name: Lint
        run: |
          ruff check .
      - name: Wheel builds and contains every entry-point module
        run: |
          pip install build
          python -m build --wheel ./packages/sdk -o /tmp/wheels
          python - <<'EOF'
          import glob, pathlib, zipfile
          required = {
              "interlatent-": ["interlatent/node/cli.py",                # interlatent-node
                               "interlatent/node/act_cli.py",             # interlatent-act
                               "interlatent/cli/main.py",                 # interlatent
                               "interlatent/inference/integration/preflight.py"],  # interlatent-preflight
          }
          for prefix, files in required.items():
              [wheel] = [w for w in glob.glob("/tmp/wheels/*.whl") if w.split("/")[-1].startswith(prefix)]
              names = zipfile.ZipFile(wheel).namelist()
              for f in files:
                  assert f in names, f"{f} missing from {wheel}"
          # Robot data ships in this wheel (ADR 0017). package-data is opt-in per
          # kind, so a new robots dir can be added and silently not ship — the node
          # then cannot start QUIC teleop for it. Check the tree against the wheel.
          [wheel] = glob.glob("/tmp/wheels/interlatent-*.whl")
          names = set(zipfile.ZipFile(wheel).namelist())
          src = pathlib.Path("packages/sdk/src/interlatent_robots")
          kinds = sorted(p.name for p in src.iterdir() if p.is_dir() and p.name != "__pycache__")
          assert kinds, f"no robot kinds found under {src}"
          for kind in kinds:
              for f in src.glob(f"{kind}/*"):
                  if f.name == "ik_config.json":
                      # Repo-only curation source (ADR 0017 amendment 2026-07-18):
                      # excluded from wheels via exclude-package-data.
                      assert f"interlatent_robots/{kind}/{f.name}" not in names, \
                          f"ik_config.json must NOT ship in the wheel (ADR 0017 amendment)"
                      continue
                  if f.suffix in (".urdf", ".json", ".lock", ".py"):
                      assert f"interlatent_robots/{kind}/{f.name}" in names, \
                          (f"interlatent_robots/{kind}/{f.name} missing from {wheel} — "
                           f"add the kind to [tool.setuptools.package-data]")
          # PEP 420: the SDK must not claim the namespace (ADR 0017 point 1).
          assert "interlatent_robots/__init__.py" not in names
          print(f"all wheels complete (robot kinds: {', '.join(kinds)})")
          EOF

  server:
    # The `interlatent-server` dist (packages/server/) — the DRTC policy server
    # that moved out of the closed engine in ADR 0035. It shipped with zero CI:
    # the wheel built and passed `twine check` while the package could not be
    # imported at all, because two relative imports written for the engine's
    # package depth (`...cloud.box_status`, `...storage.lerobot_*`) resolved
    # past the top of `interlatent_server`. Build-time checks cannot see that.
    # Import it.
    #
    # x86 only, unlike the SDK matrix: this runs on a CUDA GPU box, not on the
    # ARM robot hardware. Nothing here needs a GPU — the tests are auth, CLI,
    # and import-surface only.
    name: server (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no torch, no lerobot)
        run: |
          # --no-deps + the light runtime deps by hand. Installing for real
          # would pull CUDA torch (~2.5 GB) for tests that never touch it, and
          # the point of the import-surface test is precisely that the package
          # works on a machine where torch is not yet importable. Dependency
          # declarations are validated by the resolve step below instead.
          pip install --no-deps -e ./packages/server
          # pytest-timeout: the test step below passes --timeout, which is a
          # plugin flag, not core pytest. Without it pytest exits 4 on the
          # unrecognized argument before running a single test.
          # pyarrow: the rebuilder stages its string annotation columns as
          # int64 and converts them in a parquet post-edit, so the tests that
          # cover that pass need to read parquet. It is a lerobot transitive
          # dep in production, but this job installs --no-deps.
          pip install grpcio protobuf numpy pillow pyarrow httpx huggingface_hub pytest pytest-timeout ruff
      - name: Import surface + recorder/rebuilder/auth/CLI tests
        run: |
          pytest packages/server/tests/ -v --timeout=120
      - name: Lint
        run: |
          ruff check packages/server
      - name: Resolve dependencies (dry run, installs nothing)
        run: |
          # Gating on the base dist, advisory on [lerobot]: the extra tracks
          # lerobot's fast-moving releases and a red there is usually upstream
          # churn, not a defect in our declaration. Same stance as the SDK's
          # ADVISORY extras.
          echo "::group::base"
          pip install --dry-run --ignore-installed ./packages/server
          echo "::endgroup::"
          echo "::group::[lerobot] (advisory)"
          pip install --dry-run --ignore-installed './packages/server[lerobot]' || \
            echo "::warning title=interlatent-server[lerobot] did not resolve::advisory only"
          echo "::endgroup::"
      - name: Wheel builds, is complete, and is publishable
        run: |
          pip install build twine
          python -m build --wheel --sdist ./packages/server -o /tmp/server-dist
          twine check /tmp/server-dist/*
          python - <<'EOF'
          import glob, zipfile
          [wheel] = glob.glob("/tmp/server-dist/interlatent_server-*.whl")
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "interlatent_server/cli.py",              # interlatent-serve entry point
              "interlatent_server/serve_gpu.py",
              "interlatent_server/credentials.py",
              "interlatent_server/box_status.py",
              "interlatent_server/server/transport.py",
              "interlatent_server/server/recorder.py",
              # The recorder's dataset writers. Omitted from the original
              # split, which is what made the dist unimportable.
              "interlatent_server/storage/lerobot_rebuild.py",
              "interlatent_server/storage/lerobot_live.py",
              # Both writers import it to pick the codec parameter for the
              # installed lerobot; shipping without it breaks recording.
              "interlatent_server/storage/lerobot_codec.py",
              # docker/gen_proto.sh regenerates the stubs in-image against the
              # image's protobuf runtime, and needs the .proto to do it.
              "interlatent_server/protocol/messages.proto",
              "interlatent_server/protocol/messages_pb2.py",
              "interlatent_server/protocol/messages_pb2_grpc.py",
          ]
          for f in required:
              assert f in names, f"{f} missing from {wheel}"
          print(f"{wheel} complete ({len(names)} entries)")
          EOF
      - name: Installed wheel imports on a bare interpreter
        run: |
          # The install above is editable and shares this checkout. Prove the
          # built artifact stands on its own in a clean venv — that is what a
          # user gets from `pip install interlatent-server`.
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --no-deps /tmp/server-dist/*.whl
          /tmp/bare/bin/pip install grpcio protobuf numpy pillow httpx huggingface_hub
          /tmp/bare/bin/python - <<'EOF'
          import importlib, pkgutil
          import interlatent_server
          mods = sorted(
              m.name for m in pkgutil.walk_packages(
                  interlatent_server.__path__, prefix="interlatent_server.")
          )
          assert mods, "package walk found nothing"
          for m in mods:
              importlib.import_module(m)
          print(f"imported {len(mods)} modules from the installed wheel")
          EOF
          /tmp/bare/bin/interlatent-serve --help > /dev/null
          echo "interlatent-serve entry point OK"

  server-lerobot:
    # The dataset writers against the REAL lerobot, plus one full rollout
    # through the real DRTC stack (client -> gRPC -> recorder -> build ->
    # inbox upload). Everything the other jobs stub.
    #
    # This job exists because a stub certified a data-loss bug as correct.
    # Both writers passed `vcodec=` to LeRobotDataset.create(); upstream
    # renamed that parameter (2026-05-14 -> camera_encoder, 2026-06-27 ->
    # rgb_encoder) and create() takes no **kwargs, so on every lerobot from
    # mid-May 2026 — INCLUDING the ref docker/Dockerfile pins — the call
    # raised TypeError. The writers catch broadly, so it surfaced as
    # "rebuild failed; aborting upload", the staged episode was deleted,
    # and the robot side saw a clean close. Every unit suite stayed green.
    #
    # NOT advisory, unlike the extras-resolve job. A red here does not mean
    # "lerobot churned" — it means episodes are being discarded.
    name: server + real lerobot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg (the encoder the dataset writers drive)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install both dists + real lerobot
        run: |
          # Both halves: the end-to-end test drives the SDK's client against
          # the server's servicer in one process. CPU torch keeps the image
          # small — nothing here runs a policy.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e './packages/server[lerobot]' -e ./packages/sdk \
                      pytest pytest-timeout
      - name: Report what resolved
        run: |
          python - <<'EOF'
          import inspect, lerobot
          from lerobot.datasets.lerobot_dataset import LeRobotDataset
          params = inspect.signature(LeRobotDataset.create).parameters
          encoder = [p for p in ("vcodec", "camera_encoder", "rgb_encoder")
                     if p in params]
          print(f"lerobot {lerobot.__version__}; encoder parameter: {encoder or 'NONE'}")
          EOF
      - name: Real dataset build + full DRTC rollout
        run: |
          set -o pipefail
          pytest packages/server/tests/test_lerobot_real_build.py \
                 packages/server/tests/test_drtc_end_to_end.py \
                 --real-lerobot -v --timeout=600 2>&1 | tee /tmp/real.txt
      - name: Fail if the tests that matter did not actually run
        # Both files guard on importorskip, so a broken install would skip
        # the whole module and this job would go green having tested
        # nothing. Name the two assertions that must have executed.
        run: |
          for t in test_the_video_is_actually_h264 test_the_episode_reaches_the_backend; do
            grep -q "$t PASSED" /tmp/real.txt || {
              echo "::error title=$t did not run::the real-lerobot job must execute it"
              exit 1
            }
          done

  teleop-web:
    # The WebXR VR teleop producer (teleop/teleop-web/) — ~14k lines that
    # landed with no build gate at all. It is a deliberate fork of the
    # dashboard's teleop engine (see its README), so nothing upstream compiles
    # it either; a broken headset build would only surface in a headset.
    name: teleop-web (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teleop/teleop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: teleop/teleop-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (pure math — no WebXR, no headset)
        # The IK, FK, clutch mapping and wrist-pivot solve are ordinary
        # functions and testable on a runner; only the XR session isn't.
        # Before this, "no runtime tests" meant a wrong sign in the pose
        # mapping could only be found by putting a headset on.
        run: npm test
      - name: Build
        run: npm run build

  extras-resolve:
    # The optional extras have never been installed or resolved in CI - only the
    # base package is. A bad pin, a typo, or a wheel that does not exist for this
    # arch therefore reaches users as a failed `pip install 'interlatent[yam]'`
    # on their robot. This resolves the full dependency graph for every extra
    # declared in pyproject.toml and installs nothing (--dry-run).
    #
    # Extras are discovered from the file, so a new one is covered automatically.
    # An extra gated to a higher interpreter than the job runs (e.g. [axol] needs
    # Python >= 3.13 via almond-axol) is reported SKIP, not FAIL.
    name: extras resolve (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Resolve every optional extra (dry run, installs nothing)
        run: |
          python - <<'EOF'
          import subprocess, sys, tomllib
          from pathlib import Path

          # Extras whose resolution is ADVISORY: always reported, never fails the
          # job. [yam] pulls i2rt straight from a git HEAD (no released metadata,
          # moves under us) and gates pyrealsense2 to x86_64, so a red here is
          # usually upstream churn rather than a defect in our declaration.
          # Keep the signal, drop the gate. As of 2026-08-06 it is red on every
          # leg for a reason worth naming: i2rt pins `ruckig==0.15.3`, which
          # publishes an sdist ONLY, and that sdist no longer builds — its
          # deprecated `cmake.targets` is rejected by scikit-build-core >= 0.10
          # ("Use build.targets instead"). i2rt pins the build backend below
          # that in `[tool.uv] build-constraint-dependencies`, which only uv
          # honors; pip needs the constraint supplied by the caller (see the
          # [yam] note in packages/sdk/pyproject.toml).
          #
          # [axol] and [dimos] are advisory for one shared upstream reason:
          # dimos[manipulation] requires a750-control under
          # `sys_platform == "linux" and platform_machine == "x86_64"`, and
          # a750-control publishes exactly one artifact — 0.1.1, a cp312
          # manylinux x86_64 wheel, no sdist. So on linux/x86_64 the dimos
          # manipulation stack resolves under Python 3.12 and NOTHING else:
          # this matrix's py3.11 x86 leg dies on "No matching distribution
          # found for a750-control", while ARM skips it (the marker is false)
          # and py3.12 x86 passes. Nothing in this repo can fix that — the
          # durable fix is upstream (a cp311 wheel, an sdist, or dropping the
          # dep). Until then it is a real user-facing break for `pip install
          # 'interlatent[dimos]'` on linux/x86_64 + 3.11, so it stays visible
          # as a WARN rather than being silenced or removed, and ROBOT.md tells
          # operators to pin 3.12.
          ADVISORY = {"yam", "axol", "dimos"}

          PYPROJECT = Path("packages/sdk/pyproject.toml")
          project = tomllib.loads(PYPROJECT.read_text(encoding="utf-8"))["project"]
          extras = sorted(project.get("optional-dependencies", {}))
          if not extras:
              sys.exit("no optional-dependencies in %s - did the file move?" % PYPROJECT)

          print("python      : %s" % sys.version.split()[0])
          print("pyproject   : %s (requires-python %s)"
                % (PYPROJECT, project.get("requires-python")))
          print("extras found: %s" % ", ".join(extras))

          rows, failures, advisories = [], [], []
          for extra in extras:
              target = "./packages/sdk[%s]" % extra
              print("::group::resolving %s" % target, flush=True)
              proc = subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--dry-run",
                   "--ignore-installed", target],
                  capture_output=True, text=True,
              )
              out = proc.stdout + proc.stderr
              print(out, flush=True)
              print("::endgroup::", flush=True)

              if proc.returncode == 0:
                  rows.append(("OK", extra, "resolves on this interpreter/arch"))
              elif "requires a different Python" in out:
                  note = next((ln.strip() for ln in out.splitlines()
                               if "requires a different Python" in ln), "python-gated")
                  rows.append(("SKIP", extra, note))
              elif extra in ADVISORY:
                  rows.append(("WARN", extra, "did NOT resolve (advisory, not gating)"))
                  advisories.append((extra, "\n".join(out.strip().splitlines()[-20:])))
              else:
                  rows.append(("FAIL", extra, "see the group above"))
                  failures.append((extra, "\n".join(out.strip().splitlines()[-20:])))

          print()
          print("=" * 72)
          print("EXTRAS RESOLUTION SUMMARY")
          print("=" * 72)
          for status, extra, note in rows:
              print("  %-4s  [%s]  %s" % (status, extra, note))
          print("=" * 72)

          for extra, tail in advisories:
              print()
              print("::warning title=extra [%s] did not resolve::advisory only - "
                    "not failing the build" % extra)
              print("--- [%s] last lines ---" % extra)
              print(tail)

          if failures:
              print()
              for extra, tail in failures:
                  print("--- [%s] last lines ---" % extra)
                  print(tail)
                  print()
              sys.exit("%d extra(s) failed to resolve. A broken declaration here "
                       "reaches users as a failed pip install on their robot."
                       % len(failures))
          print()
          print("no gating extra failed to resolve.")
          EOF

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action v2 requires a paid license for organization repos. Run it only
      # when the GITLEAKS_LICENSE secret is configured; skip cleanly otherwise so the
      # check doesn't hard-fail on forks or before the secret is set.
      - name: Secret scan (gitleaks)
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ env.GITLEAKS_LICENSE }}

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          missing=0
          # --no-merges: on a pull_request build HEAD is the synthetic
          # refs/pull/N/merge commit, which has no sign-off and isn't ours to sign.
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by:'; then
              echo "Missing Signed-off-by: $sha"; missing=1
            fi
          done
          exit $missing
