[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interlatent"
version = "3.0.0"
description = "Interlatent SDK — one open interface to control robots: drive them, run policies, and collect data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Interlatent Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "requests>=2.31.0",
  "torch>=2.0",
  "numpy>=1.21",
  "httpx",
  # DRTC client: gRPC + gRPC-Web (for the hosted Modal endpoint).
  "grpcio>=1.60",
  "grpcio-tools>=1.60",
  # The checked-in stubs (protocol/messages_pb2.py) are gencode 6.31.1 and
  # validate the runtime at import: 6.31.0 raises VersionError, and anything
  # below 5.27 has no google.protobuf.runtime_version at all. A lower floor
  # resolves to an install where every inference module fails to import.
  "protobuf>=6.31.1,<7",
  "sonora>=0.2.2",
  "cmake",
]

[project.optional-dependencies]
# pip install 'interlatent[lerobot]'
# The LeRobot-native robot/teleop stack used by the node's generic control
# loop and `interlatent-act`. (Datasets are built server-side by the hosted
# recorder — ADR 0022 — so this extra no longer powers any on-device build.)
lerobot = [
  "huggingface_hub>=0.20",
  # [dataset] is not optional for us: since lerobot 0.6, importing
  # `lerobot.datasets` raises unless `datasets` and `av` are present, and
  # the node's control loop reaches that module. Declaring the bare name
  # produced an install whose dataset path could not be imported at all.
  "lerobot[dataset]>=0.4.0",
  "pyarrow>=14",
  "Pillow>=9",
]

# pip install 'interlatent[turbo]'
# Fast CPU JPEG encoding for the node capture path (node/jpeg.py): libjpeg-turbo
# via PyTurboJPEG is several times faster than PIL — the difference between the
# capture thread keeping up or not at 3 cameras x 720p x 30fps (ADR 0023).
# Host requirement NOT installed here: the libturbojpeg shared library
# (apt install libturbojpeg0-dev / brew install jpeg-turbo); without it the
# encoder resolver silently falls back to cv2/PIL.
turbo = [
  "PyTurboJPEG>=1.7",
]

# pip install 'interlatent[teleop-quic]'
# Low-latency in-browser teleop path: the node dials the QUIC/WebTransport relay
# and consumes joint-target datagrams (node/teleop/quic_channel.py). aioquic is
# optional — only needed on nodes running the QUIC transport; the default WS
# teleop path (node/teleop/channel.py) needs only `websockets` (a core dep).
# `interlatent up` serving teleop itself: the vendored WebTransport relay plus
# the short-lived self-signed certificate the browser pins. A coordinator
# without these still runs; its teleop-token route just 404s, which turns
# teleop off cleanly.
teleop-relay = [
  "aioquic>=1.3.0,<2",
  "cryptography>=42",
]

teleop-quic = [
  # >=1.3: the video tee's stream-completion check reads
  # QuicConnection._streams (validated on 1.3.x; see quic teleop ADR).
  "aioquic>=1.3.0,<2",
]

# pip install 'interlatent[axol]'
# Drives the Almond Axol dual-arm robot via its native async SDK, through a
# native control loop (robot kind "axol"; see interlatent.adapters.axol). The
# onboard ZED cameras use almond-axol's lerobot ZedCamera (opened by serial), so
# this extra pulls in lerobot via almond-axol.
# Requires Python >= 3.13 (almond-axol's floor).
# Host requirement NOT installed here: the ZED SDK + its `pyzed` Python bindings
# (not on PyPI — install the ZED SDK, then `axol zed.install`). opencv (cv2) is
# pulled below for the BGRA->RGB frame conversion.
# NOTE: almond-axol maps some deps (e.g. pyroki) to git via [tool.uv.sources], which
# ONLY uv honors. Under pip those bare names fall through to PyPI and fail — pyroki
# isn't published there ("No matching distribution"). We mirror that git source as a
# direct URL here (pinned to almond-axol's rev) so this extra also installs under pip.
# The `python_version >= '3.13'` markers are LOAD-BEARING, and not only for this
# extra: `uv lock` resolves every extra together, universally, across the whole
# `requires-python` range. Unmarked, almond-axol's own >=3.13 floor made that
# resolution unsatisfiable — so ANY `uv lock`/`uv sync`/`uv run` on this project
# (e.g. installing the [dimos] extra to run `dimos run interlatent.a1z`) died on
# "almond-axol==0.1.0 cannot be used", an extra it never asked for. Same reason
# the [dimos] pins carry the mirror-image `< '3.13'` marker: the two extras'
# interpreter ranges are disjoint, and only markers tell the resolver that.
# The SPACE before each `;` is required, not style: PEP 508 grammar is
# `url_req = name urlspec wsp+ quoted_marker?`, so on a URL requirement (unlike
# a version one) a semicolon flush against the URL is swallowed INTO the URL.
# uv parses it leniently; setuptools rejects the file outright ("must be
# pep508").
axol = [
  "almond-axol @ git+https://github.com/almond-bot/axol.git@6f226c1db5d702a74596d240d0c78edb17775bae ; python_version >= '3.13'",
  "pyroki @ git+https://github.com/chungmin99/pyroki.git@388e43e1fc0d0ee382968d3dd72970fd62a0450c ; python_version >= '3.13'",
  "opencv-python-headless>=4.8",
]

# pip install 'interlatent[yam]'
# Drives I2RT's YAM bimanual arms over CAN via the i2rt driver directly (robot kind
# "yam"; see interlatent.adapters.yam), through a native control loop. No raiden
# dependency — only i2rt + RGB camera libs.
# PYTHON VERSION: i2rt/raiden pin YAM to Python >=3.11,<3.12; confirm i2rt's actual
# floor on install — it may constrain this extra's interpreter below the SDK's range.
# INSTALL UNDER pip NEEDS A BUILD CONSTRAINT (2026-08-06): i2rt pins
# `ruckig==0.15.3`, which publishes an sdist only — so it is compiled on every
# install, on every platform — and that build now fails outright, because ruckig's
# deprecated `cmake.targets` is rejected by scikit-build-core >= 0.10 ("Use
# build.targets instead of cmake.targets"). i2rt's own fix is
# `[tool.uv] build-constraint-dependencies = ["scikit-build-core<0.10"]`, which ONLY
# uv honors: `uv pip install 'interlatent[yam]'` works, plain pip does not. Under pip,
# supply the same constraint yourself — it applies to isolated build envs too:
#   printf 'scikit-build-core<0.10\n' > /tmp/c.txt
#   PIP_CONSTRAINT=/tmp/c.txt pip install 'interlatent[yam]'
# Drop this note when i2rt moves off 0.15.3 (ruckig ships wheels again at 0.19.x).
# Host requirement NOT pinned here: the ZED SDK + its `pyzed` Python bindings (not on
# PyPI) are needed only for ZED cameras; RealSense cameras use pyrealsense2 below.
# Linux + SocketCAN is required (the arms speak CAN; cameras are RGB-only).
yam = [
  "i2rt @ git+https://github.com/i2rt-robotics/i2rt.git",
  # pyrealsense2 ships wheels ONLY (no sdist) and only for x86_64 Linux/Windows
  # across all Pythons; aarch64 wheels stop at cp310, and there are no macOS wheels
  # at any version. The marker must therefore exclude darwin as well as non-x86_64:
  # `platform_machine == 'x86_64'` alone is TRUE on an Intel Mac and hard-fails there
  # with "No matching distribution" — the exact failure the gate exists to prevent.
  # On excluded hosts install the RealSense binding out-of-band (apt
  # python3-pyrealsense2, or build librealsense). YAM itself needs Linux + SocketCAN;
  # this only keeps `pip install interlatent[yam]` resolvable elsewhere for dev.
  "pyrealsense2>=2.54; platform_machine == 'x86_64' and sys_platform != 'darwin'",
  # Generic UVC/V4L2 webcams (e.g. a Logitech on /dev/video2) capture via OpenCV.
  "opencv-python-headless>=4.8",
  "numpy",
]

# pip install 'interlatent[so101]'
# Drives a single SO-101 follower arm via lerobot's SO101Follower (robot kind
# "so101"; resolved in node/control.py::_make_lerobot_robot). The driver stack
# is exactly the [lerobot] extra — keep the two lists in sync; this alias
# exists so `interlatent[<kind>]` works for every kind that ships robot data.
so101 = [
  "huggingface_hub>=0.20",
  "lerobot>=0.4.0",
  "pyarrow>=14",
  "Pillow>=9",
]

# pip install 'interlatent[nori]'
# Drives the Nori robot through its on-Pi daemon (NoriCoreAgent) over the
# Nori-Protocol v1 NDJSON contract on TCP localhost:7777 (robot kind "nori";
# see interlatent.adapters.nori), through a native control loop. Deliberately
# NOT a dependency on the TypeScript @nori/sdk — the wire contract is the
# dependency (vendored for tests at tests/fixtures/nori_protocol/). LAN/on-Pi
# only: the node is expected to run on the robot's Pi next to the daemon.
# All motion safety is enforced daemon-side; the adapter's keep-alive pump is
# liveness-tied so it can never defeat the daemon watchdog (ADR 0015).
nori = [
  # Camera frames arrive on the daemon's companion ZeroMQ MJPEG channel.
  "pyzmq>=25",
  # JPEG decode for those frames (PIL fallback exists but cv2 is the fast path).
  "opencv-python-headless>=4.8",
  "numpy",
]

# pip install 'interlatent[dimos]'
# Binds to a RUNNING dimos stack as an external LCM/Zenoh bus peer (robot kind
# "dimos", --robot-arg kind=<embodiment>; see interlatent.adapters.dimos and
# ADR 0018). No motor driver here — the dimos process is the "vendor SDK": the
# adapter streams joint_command to a dimos servo task and reads
# coordinator_joint_state + camera Image topics. Same host (or same bus) as the
# dimos stack; both processes must agree on DIMOS_TRANSPORT (lcm|zenoh).
# PYTHON VERSION: dimos pins <3.13 while the SDK allows >=3.11 — this extra
# resolves only on 3.11/3.12 (axol-precedent: the sharper floor/ceiling is
# documented on the extra, not imposed on the base package). On **linux/x86_64
# the real floor is 3.12**, and it is not ours to relax: dimos[manipulation]
# requires a750-control under `sys_platform == "linux" and platform_machine ==
# "x86_64"`, and a750-control ships exactly one artifact — 0.1.1, a cp312
# manylinux x86_64 wheel, no sdist. On 3.11 x86_64 the install dies with "No
# matching distribution found for a750-control"; other arches never evaluate the
# marker. Narrowing our own marker to 3.12 would only trade a loud failure for a
# silent no-op install, so the marker stays `< '3.13'` and CI carries [dimos] as
# advisory (.github/workflows/ci.yml, extras-resolve).
# HEAVY: dimos unconditionally pulls open3d, rerun-sdk, opencv-contrib,
# numba, and pinocchio. Expect a multi-GB environment.
dimos = [
  # [manipulation] is required by the shipped session blueprint (ManipulationModule
  # + Viser preview — ROBOT.md "Special case: the dimos adapter"), not by the
  # adapter itself: without it `dimos run interlatent.xarm7` fails at import.
  "dimos[manipulation]>=0.0.14b1; python_version < '3.13'",
  # Undeclared imports of dimos 0.0.14b1's camera module (pulled in by the
  # blueprint off-sim): dimos/web/websocket_vis imports all three at module
  # scope but its pyproject declares none of them. Drop when dimos fixes it.
  "python-socketio; python_version < '3.13'",
  "starlette; python_version < '3.13'",
  "uvicorn; python_version < '3.13'",
  # Galaxea's own A1Z SDK, imported by dimos's `hardware/manipulators/
  # galaxea_a1z/adapter.py` (`import a1z`) and declared by NOBODY: dimos ships
  # the vendor pin in `bin/hardware/a1z/setup`, a bash script that refuses to
  # run outside a dimos SOURCE checkout ("must run from a DimOS source
  # checkout" — it wants pyproject.toml + uv.lock at the repo root). Installing
  # dimos as a wheel, which is the only thing this extra can do, therefore had
  # no path to it at all. Same rev that script pins; it is not on PyPI, so the
  # git URL is the dependency (note the whitespace before `;` — PEP 508 folds a
  # flush semicolon into the URL).
  # Only the real-hardware path needs it — the mock/sim `dimos run
  # interlatent.a1z` runs fine without — but it is small (numpy + python-can +
  # pin, all of which the dimos stack already carries) and a robot arm that
  # cannot be driven is not worth the saving.
  # NOT installed here, per dimos's setup script: `can-utils` on Linux (the
  # `cansend` binary), and on macOS `brew install libusb` plus the
  # `gs-usb`/`pyusb` bindings for a USB-CAN adapter. See ROBOT.md.
  "a1z @ git+https://github.com/userguide-galaxea/GALAXEA-A1Z.git@e931ecd0e25ad35df251097ba42921b3d2fa7224 ; python_version < '3.13'",
]

[project.scripts]
# Connectivity check: opens a real DRTC session against a managed GPU pod
# with synthetic observations and reports a latency verdict — no robot needed.
interlatent-preflight = "interlatent.inference.integration.preflight:main"
# Daemon that runs on a Pi (or any always-on machine) and converges to
# whatever inference session the coordinator has assigned to the Node.
interlatent-node = "interlatent.node.cli:main"
# One-shot manual move: drive a robot to absolute joint targets and exit.
# `interlatent-act --robot so101 --port /dev/ttyACM0 shoulder_pan=30`. Needs [lerobot].
interlatent-act = "interlatent.node.act_cli:main"
# Runs the coordinator (`interlatent up`) and drives it: list GPU boxes and
# nodes, start/stop inference sessions. `interlatent gpus ls`, `session start`, ...
interlatent = "interlatent.cli.main:main"
# (interlatent-sync-rollout was removed with client-side collection —
# ADR 0022: recording is streaming-first through a hosted session.)

# Reference dimos session blueprints, discovered by dimos's external-blueprint
# registry (namespace = this distribution's name): `dimos run interlatent.xarm7`.
# Metadata-only for base installs — dimos imports the target lazily, and the
# module's import guard turns a missing [dimos] extra into one actionable error.
[project.entry-points."dimos.blueprints"]
xarm7 = "interlatent.adapters.dimos.blueprints:xarm7"
xarm6 = "interlatent.adapters.dimos.blueprints:xarm6"
a1z = "interlatent.adapters.dimos.blueprints:a1z"

[project.urls]
Homepage = "https://github.com/interlatent/interlatent"
Documentation = "https://github.com/interlatent/interlatent/tree/main/docs"
Issues = "https://github.com/interlatent/interlatent/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# Matches both `interlatent` and the `interlatent_robots` namespace. namespaces:
# interlatent_robots/ deliberately has no __init__.py (PEP 420) so the SDK never
# claims the namespace and a kind can be split into its own distribution later
# without moving the import path.
include = ["interlatent*"]
namespaces = true

[tool.setuptools.package-data]
# Built-in behavior definitions shipped per robot (interlatent.behaviors.data).
"interlatent.behaviors" = ["data/*.toml"]
# dimos-mediated kind declarations + teleop profiles, one TOML per kind
# (kinds.py / robot_profile.py load these at runtime; see adapters/dimos/robots/).
"interlatent.adapters.dimos" = ["robots/*.toml"]
# Robot embodiment data, one subpackage per kind (interlatent_robots.<kind>).
# ~18 KB of JSON/XML per robot — small enough to ship for every kind rather than
# gate behind the per-kind extras, which carry the *driver* deps, not the data.
# Note ik_config.json is carved back out below — see exclude-package-data.
"interlatent_robots.yam" = ["*.urdf", "*.json", "*.lock"]
"interlatent_robots.nori" = ["*.urdf", "*.json", "*.lock"]
"interlatent_robots.a1z" = ["*.urdf", "*.json", "*.lock"]
"interlatent_robots.so101" = ["*.urdf", "*.json", "*.lock"]
"interlatent_robots.xarm7" = ["*.urdf", "*.json", "*.lock"]
"interlatent_robots.xarm6" = ["*.urdf", "*.json", "*.lock"]

[tool.setuptools.exclude-package-data]
# ik_config.json is the hand-authored curation source for the MuJoCo
# kinematic-spec exporter, not a runtime file: the node consumes only
# kinematic_spec.json (node/teleop/quic_channel.py). It stays in the repo
# (and sdist, via MANIFEST.in) but is excluded from wheels/installs.
# ADR 0017, amendment 2026-07-18. Keyed "*" so a new kind can't ship it.
"*" = ["ik_config.json"]

# ---------------------------------------------------------------------------
# CPU-only torch wheels.
#
# The default PyPI `torch` wheel bundles the full NVIDIA CUDA stack
# (nvidia-cuda-runtime, cudnn, cublas, nvjitlink, ... — several GB) on Linux
# x86_64, even on a machine with no GPU. This SDK is the robot-/edge-side
# package: it uses torch only for CPU-side work — tensor marshalling and
# `isinstance(model, torch.nn.Module)` framework detection in
# interlatent._client — and never calls `.cuda()` / moves data to a GPU. GPU
# inference runs on managed cloud GPU pods over DRTC, not here. So we pin
# torch (and torchvision, pulled in by
# the [lerobot] extra) to PyTorch's CPU wheel index.
#
# This block is honoured by `uv` (uv pip install / uv sync). Plain pip does
# not read index config from pyproject.toml — see the README "Install" section
# for the equivalent `--index-url https://download.pytorch.org/whl/cpu` command.
#
# Note: lerobot ships this same [tool.uv.sources] mechanism but pins to the
# *CUDA* (cu128) index; the override below keeps SDK installs on the CPU index.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Mutually exclusive extras.
#
# `uv lock` resolves ALL extras into one universal lock, so two extras that can
# never share an environment make the whole project unlockable — including for
# somebody who only wants a third extra. The three heavy vendor-driver extras
# are pairwise that way, each for its own reason:
#   [axol] vs [yam]    — python-can (almond-axol >=4.6.1 vs i2rt ==4.5.0)
#   [dimos] vs [yam]   — rerun-sdk (dimos ==0.32.0 vs i2rt >=0.32.2)
#   [axol] vs [dimos]  — disjoint interpreters (>=3.13 vs <3.13)
# No robot is two of an Almond Axol, an I2RT YAM, and a dimos stack, so listing
# them as one mutually-exclusive group (at most one per environment) costs
# nothing and lets uv fork the resolution instead of failing it.
#
# [yam] additionally excludes the lerobot-based extras: i2rt wants
# rerun-sdk>=0.32.2, and on 3.11 (i2rt's own ceiling) the newest installable
# lerobot is 0.4.x, which pins rerun-sdk<0.27. YAM is a native adapter and
# needs nothing from lerobot, so this only forbids a combination that was
# never installable. Everything else ([nori], [turbo], [teleop-quic],
# [lerobot]+[so101]) stays freely combinable.
#
# uv-only — under pip, `interlatent[axol,yam]` remains what it has always
# been: unsatisfiable.
[tool.uv]
conflicts = [
  [{ extra = "axol" }, { extra = "yam" }, { extra = "dimos" }, { extra = "lerobot" }],
  [{ extra = "axol" }, { extra = "yam" }, { extra = "dimos" }, { extra = "so101" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
